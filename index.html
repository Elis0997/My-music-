<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liss Music Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    h2 { margin-bottom: 15px; font-size: 20px; }
    
    /* Кнопки плейлистов */
    .categories { display: flex; gap: 8px; overflow-x: auto; width: 100%; max-width: 380px; margin-bottom: 20px; padding-bottom: 8px; }
    .cat-btn { background: #282828; color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .cat-btn.active { background: #1db954; font-weight: bold; color: #000; }

    /* Плеер */
    .player-card { background: #181818; width: 100%; max-width: 380px; border-radius: 16px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
    .cover { width: 100%; height: 260px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; background: #282828; }
    .song-title { font-size: 18px; font-weight: bold; margin-bottom: 4px; }
    .song-artist { font-size: 14px; color: #b3b3b3; margin-bottom: 15px; }

    /* Управление */
    .controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 15px; }
    .btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
    .play-btn { background: #1db954; color: #000; width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; }

    /* Текст песни */
    .lyrics-container { margin-top: 15px; padding-top: 15px; border-top: 1px solid #282828; text-align: left; max-height: 150px; overflow-y: auto; }
    .lyrics-title { font-size: 14px; font-weight: bold; color: #1db954; margin-bottom: 8px; }
    .lyrics-text { font-size: 13px; color: #ccc; white-space: pre-line; line-height: 1.5; }
  </style>
</head>
<body>

  <h2>🎧 Liss Music</h2>

  <!-- Полоса выбора плейлистов -->
  <div class="categories" id="categoryContainer"></div>

  <!-- Карточка плеера -->
  <div class="player-card">
    <img id="cover" class="cover" src="" alt="Cover">
    <div id="title" class="song-title">Загрузка...</div>
    <div id="artist" class="song-artist"></div>

    <audio id="audio"></audio>

    <div class="controls">
      <button class="btn" onclick="prevSong()">⏮</button>
      <button class="btn play-btn" id="playBtn" onclick="togglePlay()">▶</button>
      <button class="btn" onclick="nextSong()">⏭</button>
    </div>

    <!-- Текст песни -->
    <div class="lyrics-container">
      <div class="lyrics-title">📜 Текст песни</div>
      <div id="lyrics" class="lyrics-text">Выбери трек...</div>
    </div>
  </div>

  <script>
    // СПИСОК ПЛЕЙЛИСТОВ ИЗ SPOTIFY
    const myCategories = ["Все", "Nostalgia∞", "❤️❤️❤️", "zzz zzz zzz", "Smtm", "Mine ♡", "Chill", "BG"];

    // СПИСОК ПЕСЕН
    const songs = [
      {
        title: "Erou",
        artist: "Emforia",
        category: "Mine ♡",
        cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
        lyrics: "Текст песни Erou..."
      },
      {
        title: "Night Lofi",
        artist: "Chill Master",
        category: "zzz zzz zzz",
        cover: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
        lyrics: "Спокойный трек для сна..."
      }
    ];

    let currentSongs = [...songs];
    let currentIndex = 0;
    let isPlaying = false;

    const audio = document.getElementById('audio');
    const title = document.getElementById('title');
    const artist = document.getElementById('artist');
    const cover = document.getElementById('cover');
    const lyrics = document.getElementById('lyrics');
    const playBtn = document.getElementById('playBtn');

    // Отрисовка кнопок плейлистов
    function initCategories() {
      const container = document.getElementById('categoryContainer');
      container.innerHTML = myCategories.map((cat, i) => 
        `<button class="cat-btn ${i === 0 ? 'active' : ''}" onclick="filterCategory('${cat}', this)">${cat}</button>`
      ).join('');
    }

    function filterCategory(cat, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentSongs = cat === "Все" ? songs : songs.filter(s => s.category === cat);
      currentIndex = 0;
      if (currentSongs.length > 0) {
        loadSong(currentSongs[currentIndex]);
      } else {
        title.innerText = "Плейлист пуст";
        artist.innerText = "";
        cover.src = "";
        lyrics.innerText = "Добавь треки в категории: " + cat;
        audio.src = "";
      }
      if (isPlaying) playSong();
    }

    function loadSong(song) {
      if (!song) return;
      title.innerText = song.title;
      artist.innerText = song.artist;
      cover.src = song.cover;
      audio.src = song.src;
      lyrics.innerText = song.lyrics || "Текст песни отсутствует";
    }

    function togglePlay() {
      if (!audio.src) return;
      if (isPlaying) pauseSong();
      else playSong();
    }

    function playSong() {
      isPlaying = true;
      playBtn.innerText = '⏸';
      audio.play();
    }

    function pauseSong() {
      isPlaying = false;
      playBtn.innerText = '▶';
      audio.pause();
    }

    function prevSong() {
      if (currentSongs.length === 0) return;
      currentIndex = (currentIndex - 1 + currentSongs.length) % currentSongs.length;
      loadSong(currentSongs[currentIndex]);
      if (isPlaying) playSong();
    }

    function nextSong() {
      if (currentSongs.length === 0) return;
      currentIndex = (currentIndex + 1) % currentSongs.length;
      loadSong(currentSongs[currentIndex]);
      if (isPlaying) playSong();
    }

    audio.addEventListener('ended', nextSong);

    initCategories();
    loadSong(currentSongs[0]);
  </script>
</body>
</html>
